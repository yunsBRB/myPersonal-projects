name: Odoo projects
on:
  push:
    paths:
      - 'odoo/**'
      - '.github/workflows/odoo.yml'
  pull_request:
    paths:
      - 'odoo/**'
      - '.github/workflows/odoo.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: odoo/yomoprotect
            module: trustgate
          - folder: odoo/lead-scoring
            module: crm_lead_qualification
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    env:
      POSTGRES_PASSWORD: odoo_test
    steps:
      - uses: actions/checkout@v4
      - name: Build Odoo environment
        run: docker compose build
      - name: Install addon and execute tests
        run: >-
          docker compose run --rm odoo
          --addons-path=/opt/odoo/addons,/mnt/extra-addons
          --data-dir=/var/lib/odoo --db_host=db --db_user=odoo
          -d ${{ matrix.module }} -i ${{ matrix.module }} --without-demo=all
          --test-enable --test-tags=/${{ matrix.module }} --stop-after-init --log-level=test
      - name: Verify application startup
        run: |
          docker compose up -d
          python scripts/check_startup.py
      - name: Log failures
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
