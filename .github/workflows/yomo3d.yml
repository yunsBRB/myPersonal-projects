name: YOMO 3D
on:
  push:
    paths: ['web/yomo3d/**', '.github/workflows/yomo3d.yml']
  pull_request:
    paths: ['web/yomo3d/**', '.github/workflows/yomo3d.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/yomo3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q yomo && python -m pytest -q
