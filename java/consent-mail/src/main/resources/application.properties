spring.application.name=consent-mail
server.address=127.0.0.1
server.port=8082
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
app.operator-password=${OPERATOR_PASSWORD}
app.reviewer-password=${REVIEWER_PASSWORD}
app.admin-password=${ADMIN_PASSWORD}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DATABASE_USER:app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.encryption-key=${CONTACT_ENCRYPTION_KEY}
